[project]
name = "lab-intake-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 80
indent-width = 4
exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Still *reported* as an unused import, just never auto-removed on save --
# otherwise saving mid-edit deletes an import before you've written the call.
unfixable = ["F401"]

# UP017 rewrites `timezone.utc` -> `UTC`; we spell it out explicitly.
ignore = ["UP017"]

select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RET", # flake8-return -- catches routes that fall off the end (RET503)
  "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["db", "route", "seed"]
